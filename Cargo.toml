[package]
name = "vaultmaid"
version = "0.1.0"
edition = "2021"
description = "Desktop app to organize a Bitwarden vault"
license = "MIT"

[dependencies]
iced = { version = "0.14", features = ["tokio", "advanced"] }
bitwarden = "0.5"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "3"
rusqlite = { version = "0.32", features = ["bundled"] }
aes-gcm = "0.10"
argon2 = "0.5"
dirs = "5"
url = "2"
thiserror = "1"
zeroize = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = "0.3"
toml = "0.8"
open = "5"
dark-light = "1"

[dev-dependencies]
wiremock = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
